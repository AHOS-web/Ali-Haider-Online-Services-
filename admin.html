<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Haider Online Services</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#f1f5f9;overflow-x:hidden}

</style></head><body>

<div class="modal" id="authModal"><div class="modal-box"><h3 id="authTitle" style="text-align:center">Signup</h3><div id="nameField"><label>Full Name *</label><input id="aName" placeholder="Apna naam"></div><label>WhatsApp Number *</label><input id="aNumber" placeholder="03XXXXXXXXX"><label>Password *</label><input id="aPass" type="password"><p id="forgotLink" style="display:none;font-size:12px;text-align:right;margin-top:8px"><span onclick="openForgot()" style="color:#1e40af;cursor:pointer;text-decoration:underline;font-weight:bold">Forget Password?</span></p><button class="btn" id="authAction" onclick="handleAuth()">Signup</button><button class="btn btn-close" onclick="closeAll()">Close</button><p id="switchAuth" style="text-align:center;font-size:12px;margin-top:10px"></p></div></div>

<script>
const ADMIN_NUMBERS=["03179964898","923179964898"];
const text="Hi, I am Haider — I provide all online services across Pakistan. From Domicile, Driving Licence, Jobs Apply, CV Making to PTA Registration & more. Welcome to Haider Online Services...";
let i=0;function typeWriter(){if(i<text.length){document.getElementById('typing').innerHTML+=text.charAt(i);i++;setTimeout(typeWriter,28);}else{setTimeout(hideIntro,2500);}}function hideIntro(){document.getElementById('intro').classList.add('hide');setTimeout(()=>{document.getElementById('intro').style.display='none'},800);}window.onload=typeWriter;
let currentAuth='signup',tempOTP=0,tempResetNumber='';
let services=[{n:"All Jobs Online Apply",i:"💼"},{n:"Domicile",i:"📜"},{n:"Driving Licence Learner",i:"🚗"},{n:"Transfer Of All Motor Vehicle",i:"🚙"},{n:"All Punjab Schemes Apply",i:"🏛️"},{n:"Admissions",i:"🎓"},{n:"Rawalpindi Board",i:"📚"},{n:"Allama Iqbal Open University",i:"🏫"},{n:"Professional CV",i:"📄"},{n:"PTA Registration",i:"📱"},{n:"Soft Skill Certificate",i:"📜"},{n:"Graphics Designing",i:"🎨"},{n:"Picture Editing",i:"🖼️"},{n:"All Country TikTok Account",i:"🎵"},{n:"UK TikTok Sim",i:"🇬🇧"}];
let cont=document.getElementById('services');services.forEach(s=>{let d=document.createElement('div');d.className='card';d.innerHTML='<div style="font-size:32px">'+s.i+'</div><b>'+s.n+'</b>';d.onclick=()=>openOrder(s.n);cont.appendChild(d);});
function openAuth(t){currentAuth=t;document.getElementById('authTitle').innerText=t=='login'?'Login':'Signup';document.getElementById('authAction').innerText=t=='login'?'Login':'Signup';document.getElementById('nameField').style.display=t=='login'?'none':'block';document.getElementById('forgotLink').style.display=t=='login'?'block':'none';document.getElementById('switchAuth').innerHTML=t=='login'? 'No account? <b onclick="openAuth(\'signup\')" style="color:#1e40af;cursor:pointer">Signup</b>':'Have account? <b onclick="openAuth(\'login\')" style="color:#1e40af;cursor:pointer">Login</b>';document.getElementById('authModal').classList.add('active');}
function openForgot(){closeAll();document.getElementById('forgotModal').classList.add('active');}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('active'));}
function handleAuth(){let name=document.getElementById('aName').value.trim(),num=document.getElementById('aNumber').value.trim(),pass=document.getElementById('aPass').value.trim();if(!num||!pass){alert('Number & Password zaruri');return;}if(currentAuth=='signup'&&!name){alert('Full Name lazmi hai');return;}let users=JSON.parse(localStorage.getItem('ahos_users')||'{}');if(currentAuth=='signup'){if(users[num]){alert('Account exists, login karo');openAuth('login');return;}users[num]={name:name,pass:pass};localStorage.setItem('ahos_users',JSON.stringify(users));localStorage.setItem('ahos_current',num);alert('Welcome '+name);closeAll();checkLogin();}else{if(!users[num]||users[num].pass!=pass){alert('Wrong password');return;}localStorage.setItem('ahos_current',num);closeAll();checkLogin();}}
function sendOTP(){let num=document.getElementById('fNumber').value.trim();let users=JSON.parse(localStorage.getItem('ahos_users')||'{}');if(!users[num]){alert('No account');return;}tempOTP=Math.floor(100000+Math.random()*900000);tempResetNumber=num;document.getElementById('otpSection').style.display='block';alert('OTP: '+tempOTP);}
function verifyOTP(){let otp=document.getElementById('fOTP').value.trim(),pass=document.getElementById('fPass').value.trim();if(otp!=tempOTP){alert('Wrong OTP');return;}let users=JSON.parse(localStorage.getItem('ahos_users')||'{}');users[tempResetNumber].pass=pass;localStorage.setItem('ahos_users',JSON.stringify(users));alert('Reset done');closeAll();openAuth('login');}
function checkLogin(){let curr=localStorage.getItem('ahos_current');let adminBtn=document.getElementById('adminBtn'),loginBtn=document.getElementById('loginBtn'),signupBtn=document.getElementById('signupBtn'),logoutBtn=document.getElementById('logoutBtn');if(curr){let users=JSON.parse(localStorage.getItem('ahos_users')||'{}');if(users[curr]){let uname=users[curr].name;document.getElementById('welcomeText').innerText='Welcome, '+uname+' 👋';document.getElementById('welcomeSub').innerText='Login: '+curr;loginBtn.style.display='none';signupBtn.style.display='none';logoutBtn.style.display='block';document.getElementById('oName').value=uname;document.getElementById('oWhatsapp').value=curr;let isAdmin=ADMIN_NUMBERS.includes(curr)||curr.includes('3179964898')||uname.toLowerCase().includes('haider');if(isAdmin){adminBtn.style.display='block';}else{adminBtn.style.display='none';}return;}}document.getElementById('welcomeText').innerText='Haider Online Services';document.getElementById('welcomeSub').innerText='📞 03179964898';loginBtn.style.display='block';signupBtn.style.display='block';logoutBtn.style.display='none';adminBtn.style.display='none';}
function logout(){localStorage.removeItem('ahos_current');location.reload();}
function openOrder(s){let curr=localStorage.getItem('ahos_current');if(!curr){alert('Pehle Signup/Login karo');openAuth('signup');return;}document.getElementById('serviceName').value=s;document.getElementById('serviceTitle').innerText=s;document.getElementById('orderModal').classList.add('active');}
function saveOrder(){let s=document.getElementById('serviceName').value,n=document.getElementById('oName').value.trim(),w=document.getElementById('oWhatsapp').value.trim(),p=document.getElementById('oProvince').value.trim(),d=document.getElementById('oDistrict').value.trim(),t=document.getElementById('oTehsil').value.trim(),a=document.getElementById('oFullAddress').value.trim(),de=document.getElementById('oDetails').value.trim();if(!n||!w||!p||!d||!t||!a){alert('Sare * bharo');return;}let order={service:s,name:n,whatsapp:w,province:p,district:d,tehsil:t,address:a,details:de,date:new Date().toLocaleString()};let all=JSON.parse(localStorage.getItem('ahos_all_orders')||'[]');all.push(order);localStorage.setItem('ahos_all_orders',JSON.stringify(all));let msg=`*NEW ORDER*%0A%0A*Service:* ${encodeURIComponent(s)}%0A*Name:* ${encodeURIComponent(n)}%0A*Number:* ${encodeURIComponent(w)}%0A*District:* ${encodeURIComponent(d)}%0A*Tehsil:* ${encodeURIComponent(t)}%0A*Address:* ${encodeURIComponent(a)}`;let waLink=`https://wa.me/923179964898?text=${msg}`;alert('✅ Order save! WhatsApp khul raha hai');closeAll();window.open(waLink,'_blank');}
checkLogin();
