let cont=document.getElementById('services');
services.forEach(s=>{

let provSel=document.getElementById('oProvince'), distSel=document.getElementById('oDistrict');
provSel.onchange=()=>{

function openAuth(t){
currentAuth=t;
document.getElementById('authTitle').innerText=t=='login'?'Login':'Signup';
document.getElementById('authAction').innerText=t=='login'?'Login':'Signup';
document.getElementById('aName').style.display=t=='login'?'none':'block';
document.getElementById('aName').previousElementSibling.style.display=t=='login'?'none':'block';
document.getElementById('forgotLink').style.display=t=='login'?'block':'none';

}
function openForgot(){closeAll();document.getElementById('forgotModal').classList.add('active');}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('active'));}
function handleAuth(){
let name=document.getElementById('aName').value.trim(),num=document.getElementById('aNumber').value.trim(),pass=document.getElementById('aPass').value.trim();
if(!num||!pass){alert('Number & Password likhen');return;}
let users=JSON.parse(localStorage.getItem('ahos_users')||'{}');
if(currentAuth=='signup'){
if(!name){alert('Name likhen');return;}
if(users[num]){alert('Is number se account hai, login karen');return;}
users[num]={name:name,pass:pass};localStorage.setItem('ahos_users',JSON.stringify(users));localStorage.setItem('ahos_current',num);closeAll();checkLogin();alert('Signup ho gaya!');
}else{
if(!users[num]||users[num].pass!=pass){alert('Number ya password galat hai');return;}
localStorage.setItem('ahos_current',num);closeAll();checkLogin();
}
}
function handleForgot(){
let num=document.getElementById('fNumber').value.trim(),pass=document.getElementById('fPass').value.trim();
if(!num||!pass){alert('Number aur naya password likhen');return;}
let users=JSON.parse(localStorage.getItem('ahos_users')||'{}');
if(!users[num]){alert('Is number se koi account nahi mila');return;}
users[num].pass=pass;localStorage.setItem('ahos_users',JSON.stringify(users));
alert('Password reset ho gaya! Ab login karen');closeAll();openAuth('login');
}
function checkLogin(){
let curr=localStorage.getItem('ahos_current');
if(curr){
let users=JSON.parse(localStorage.getItem('ahos_users')||'{}');
if(users[curr]){
document.getElementById('welcomeText').innerText='Welcome, '+users[curr].name;
document.getElementById('loginBtn').style.display='none';
document.getElementById('signupBtn').style.display='none';
document.getElementById('logoutBtn').style.display='block';
document.getElementById('oName').value=users[curr].name;
document.getElementById('oWhatsapp').value=curr;
document.getElementById('aName').value=users[curr].name;
document.getElementById('aNumber').value=curr;
}
}
}
function logout(){localStorage.removeItem('ahos_current');location.reload();}
function openOrder(s){
let curr=localStorage.getItem('ahos_current');
if(!curr){alert('Pehle Login / Signup karen');openAuth('signup');return;}
document.getElementById('serviceName').value=s;
document.getElementById('serviceTitle').innerText=s;

function sendWhatsApp(){
